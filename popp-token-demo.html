<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PoPP Token Demo</title>
  <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7/bundles/stomp.umd.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 2rem; max-width: 60rem; }
    input { width: 20rem; }
    #status { margin-left: 1rem; }
    .msg { border: 1px solid #ccc; border-radius: 6px; padding: 1rem; margin-top: 1rem; }
    .token { word-break: break-all; font-family: monospace; background: #f5f5f5; padding: 0.5rem; }
  </style>
</head>
<body>
  <h1>PoPP Token Demo</h1>
  <p>
    <label>popp-client URL:
      <input id="serverUrl" value="ws://localhost:8081/popp-events">
    </label>
  </p>
  <p>
    <label>Topic (/topic/popp-token/&lt;card-terminal-id&gt;):
      <input id="topic" value="/topic/popp-token/00:1B:B5:0E:8D:98">
    </label>
    <button id="connect">Subscribe</button>
    <span id="status">disconnected</span>
  </p>
  <div id="messages"></div>

  <script>
    const params = new URLSearchParams(location.search);
    if (params.get("topic")) document.getElementById("topic").value = params.get("topic");

    let client;
    document.getElementById("connect").onclick = () => {
      if (client) client.deactivate();
      const topic = document.getElementById("topic").value.trim();

      client = new StompJs.Client({
        brokerURL: document.getElementById("serverUrl").value.trim(),
      });
      client.onConnect = () => {
        document.getElementById("status").textContent = "subscribed to " + topic;
        client.subscribe(topic, (msg) => {
          const m = JSON.parse(msg.body);
          let detail;
          if (m.type === "CardInserted") {
            detail = "card inserted (KVNR " + m.kvnr + ") &mdash; fetching PoPP token&hellip;";
          } else if (m.type === "Token") {
            detail = "KVNR " + m.kvnr + "<div class='token'>" + m.token + "</div>";
          } else if (m.type === "TokenRetrievalFailed") {
            detail = "token retrieval failed: " + m.error;
          } else if (m.type === "CardRemoved") {
            detail = "card removed";
          } else {
            detail = msg.body;
          }
          const div = document.createElement("div");
          div.className = "msg";
          div.innerHTML =
            "<b>" + new Date().toLocaleTimeString() + "</b>" +
            " &mdash; <b>" + m.type + "</b>" +
            " &mdash; terminal " + m.ctId + ", slot " + m.slotId + "<br>" + detail;
          document.getElementById("messages").prepend(div);
        });
      };
      client.onWebSocketClose = () => {
        document.getElementById("status").textContent = "disconnected";
      };
      client.activate();
    };
  </script>
</body>
</html>
