server:
  port: 8081
  tomcat:
    max-http-form-post-size: 2147483648 # 2GB

springdoc:
  api-docs:
    enabled: true

popp-server:
  url: wss://popp.dev.poppservice.de:443/popp/practitioner/api/v1/token-generation-ehc
connector:
  use-for-signature: true
  end-point-url: ${CONNECTOR_END_POINT_URL:https://127.0.0.1}
  proxy-port: ${CONNECTOR_PROXY_PORT:8780}
  log-ws: true
  real-connector-event-service-version: ${CONNECTOR_EVENT_SERVICE_VERSION:}
  secure:
    enable: ${CONNECTOR_SECURE_ENABLE:true}
    hostname-validation: ${CONNECTOR_SECURE_HOSTNAME_VALIDATION:false}
    keystore: ${CONNECTOR_SECURE_KEYSTORE:keystore.p12}
    keystore-password: ${CONNECTOR_SECURE_KEYSTORE_PASSWORD:changeit}
    trust-all: ${CONNECTOR_SECURE_TRUST_ALL:true}
    truststore: ${CONNECTOR_SECURE_TRUSTSTORE:truststore.p12}
    truststore-password: ${CONNECTOR_SECURE_TRUSTSTORE_PASSWORD:changeit}
  terminal-configuration:
    context:
      clientSystemId: ${CONTEXT_CLIENT_SYSTEM_ID:C1}
      workplaceId: ${CONTEXT_WORKPLACE_ID:W1}
      mandantId: ${CONTEXT_MANDANT_ID:M1}
      userId: ${CONTEXT_USER_ID:}

zeta:
  client:
    disableServerValidation: ${ZETA_CLIENT_DISABLE_SERVER_VALIDATION:true}
  authentication.smb:
    alias: ${ZETA_AUTHENTICATION_SMB_ALIAS:alias}
    keyfile: ${ZETA_AUTHENTICATION_SMB_KEYFILE:docker/zeta/smcb-private/smcb_private.p12}
    password: ${ZETA_AUTHENTICATION_SMB_PASSWORD:00X}
    card-handle: ${ZETA_AUTHENTICATION_SMB_CARD_HANDLE:SMC-B-6}

card-reader:
  name:

virtual-card:
  image-file:

federation:
  keystore:
    location: "classpath:federation-keystore.jks"
    password: "gematik"
  entity-statement:
    url: "http://localhost:1080/.well-known/openid-federation"
logging:
  level:
    de.gematik.zeta: DEBUG
  structured:
    format:
      console: ${LOG_FORMAT:}
